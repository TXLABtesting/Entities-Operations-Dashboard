name: Deploy public site to GitHub Pages

# Builds the public site and publishes it to GitHub Pages so the pages can be
# opened and tested on a real device before the platform is wired up.
#
# The deploy job enables Pages itself on first run (configure-pages with
# enablement) — the repository only needs to be public. The site is served at:
#   https://<owner>.github.io/<repo>/

on:
  push:
    branches:
      - claude/zen-johnson-seuc0f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build (base = /<repo>/ for project Pages)
        run: pnpm build --base=/${{ github.event.repository.name }}/

      - name: Add SPA fallback (client-side routing on deep links)
        run: cp dist/public/index.html dist/public/404.html

      - name: Disable Jekyll processing
        run: touch dist/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable Pages if this is the first deployment
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
